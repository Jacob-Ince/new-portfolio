name: Fallback Maintenance

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-fallbacks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync fallback content and media mirror
        run: npm run sync-fallbacks:mirror
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}

      - name: Prune unreferenced mirrored files
        run: npm run prune:fallback-media

      - name: Generate bandwidth top-offender report
        run: npm run report:media-offenders

      - name: Commit fallback refresh if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh mirrored fallback media and bandwidth report"
          file_pattern: "src/app/media-list.json src/app/work/work-cards-fallback.json public/fallback-media/** reports/media-bandwidth-report.md"
